<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting Contact Us Page</title>
    <meta name="description" content="Contact page for the White Water Rafting website.">
    <meta name="author" content="Fábio Greco Torres">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="White Water Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-container">
            <div class="map">
                <iframe src="https://www.google.com/maps?q=Kolob%2C%20California&output=embed"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form">
                <div class="form-data">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                <div class="form-data">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-data">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="newsletter">
                        Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">
                    Get in Touch!
                </button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-cards">
                <figure>
                    <img src="image/employee1.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="image/employee1.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="image/employee1.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy;2026 | White Water Company | Fábio Torres</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
